<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>کتابچه جامع قالب‌های محتوا</title>

  <meta name="theme-color" content="#111827">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <!-- Header -->
    <header class="topbar">

      <button class="icon-btn" id="menuBtn" aria-label="فهرست">
        ☰
      </button>

      <div class="book-title">
        <strong>کتابچه جامع قالب‌های محتوا</strong>
        <span>راهنمای کاربردی تولید محتوا</span>
      </div>

      <button class="icon-btn" id="themeBtn" aria-label="حالت شب">
        ☾
      </button>

    </header>


    <!-- Progress -->
    <div class="progress-area">
      <div class="progress">
        <div id="progressBar"></div>
      </div>

      <div class="page-info">
        <span id="pageNumber">۱</span>
        <span>از</span>
        <span id="totalPages">۱</span>
      </div>
    </div>


    <!-- Book -->
    <main class="book-area">

      <button class="nav-btn prev" id="prevBtn">
        ‹
      </button>

      <div class="book">

        <div id="pages" class="pages">
          <!-- صفحات با JavaScript ساخته می‌شوند -->
        </div>

      </div>

      <button class="nav-btn next" id="nextBtn">
        ›
      </button>

    </main>


    <!-- Bottom controls -->
    <footer class="controls">

      <button id="firstBtn">
        ⏮
        <span>اول</span>
      </button>

      <button id="prevBottomBtn">
        ←
        <span>قبلی</span>
      </button>

      <button id="nextBottomBtn">
        →
        <span>بعدی</span>
      </button>

      <button id="lastBtn">
        ⏭
        <span>آخر</span>
      </button>

    </footer>


    <!-- Menu -->
    <aside id="sideMenu" class="side-menu">

      <div class="menu-header">
        <strong>فهرست کتاب</strong>

        <button id="closeMenu">
          ×
        </button>
      </div>

      <div id="toc" class="toc"></div>

    </aside>

    <div id="overlay" class="overlay"></div>

  </div>


  <script src="app.js"></script>

</body>
</html>
