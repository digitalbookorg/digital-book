<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>کتابچه جامع قالب‌های محتوا</title>

  <meta name="description" content="کتابچه جامع قالب‌های محتوا">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="topbar">

    <div class="title">
      <span class="book-icon">📖</span>

      <div>
        <h1>کتابچه جامع قالب‌های محتوا</h1>
        <small>نسخه دیجیتال</small>
      </div>
    </div>

    <div class="actions">
      <button id="themeBtn">🌙</button>
      <button id="fullscreenBtn">⛶</button>
    </div>

  </header>


  <main>

    <section class="reader">

      <button class="nav prev" id="prevBtn">‹</button>

      <article class="book">

        <div class="page">

          <div class="page-number" id="pageNumber">
            ۱
          </div>

          <div id="pageContent"></div>

        </div>

      </article>

      <button class="nav next" id="nextBtn">›</button>

    </section>


    <section class="controls">

      <button id="firstBtn">⏮</button>

      <button id="zoomOutBtn">−</button>

      <span id="pageInfo">۱ / ۳۶</span>

      <button id="zoomInBtn">＋</button>

      <button id="lastBtn">⏭</button>

    </section>


    <div class="progress">

      <div id="progressBar"></div>

    </div>


    <div class="hint">
      برای جابه‌جایی بین صفحات از دکمه‌ها یا کشیدن صفحه استفاده کن
    </div>

  </main>


  <footer>
    کتابچه جامع قالب‌های محتوا
  </footer>


  <script src="app.js"></script>

</body>
</html>
